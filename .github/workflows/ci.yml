name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit:
    name: Unit Tests (no DB required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ -v

  coverage:
    name: Full Test Suite + Coverage ≥ 80%
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dodoo_admin
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: dodoo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run all tests with coverage
        run: |
          pytest tests/unit/ tests/integration/ tests/e2e/ \
            --cov=dodoo --cov-report=term-missing --cov-fail-under=80
        env:
          DATABASE_URL: postgresql+asyncpg://dodoo_admin:testpass@localhost/dodoo_test
          DATABASE_MIGRATION_URL: postgresql+asyncpg://dodoo_admin:testpass@localhost/dodoo_test
          SESSION_EXPIRY_HOURS: "8"

  audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip-audit --strict
