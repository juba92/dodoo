name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit:
    name: Unit Tests (no DB required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ -v

  coverage:
    name: Full Test Suite + Coverage ≥ 80%
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dodoo_admin
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: dodoo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run all tests with coverage
        run: |
          pytest tests/unit/ tests/integration/ tests/e2e/ \
            --cov=dodoo --cov-report=term-missing --cov-fail-under=80
        env:
          DATABASE_URL: postgresql+asyncpg://dodoo_admin:testpass@localhost/dodoo_test
          DATABASE_MIGRATION_URL: postgresql+asyncpg://dodoo_admin:testpass@localhost/dodoo_test
          SESSION_EXPIRY_HOURS: "8"

  js-unit:
    name: JS Unit Tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run api.js unit tests
        run: node --test dodoo/addons/web/static/tests/api.test.js

  e2e:
    name: E2E Browser Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dodoo_admin
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: dodoo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dodoo_admin:testpass@localhost/dodoo_test
      DATABASE_MIGRATION_URL: postgresql+asyncpg://dodoo_admin:testpass@localhost/dodoo_test
      SESSION_EXPIRY_HOURS: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: CVE audit (Constitution VII)
        run: pip-audit --strict
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium firefox
      - name: Install web addon
        run: python -m dodoo module install web
      - name: Start dodoo server
        run: python -m dodoo server --port 8069 &
      - name: Wait for server health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8069/web/health && break
            sleep 1
          done
      - name: Run E2E tests (Chromium)
        run: pytest tests/e2e/test_web_ui.py -v --tb=short
      - name: Run E2E tests (Firefox) — SC-004
        run: pytest tests/e2e/test_web_ui.py -v --tb=short --browser firefox
      - name: Run Accessibility tests
        run: pytest tests/e2e/test_web_ui_a11y.py -v --tb=short
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip-audit --strict
