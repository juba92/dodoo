[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dodoo"
version = "0.1.0"
description = "Minimal Odoo-like ERP core"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.1",
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "argon2-cffi==23.1.0",
    "pydantic==2.7.4",
    "uvicorn[standard]==0.30.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "testcontainers[postgres]==4.7.1",
    "httpx==0.27.0",
    "ruff==0.4.10",
    "pip-audit==2.7.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dodoo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["dodoo"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.licenses]
approved = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "PSF-2.0", "ISC"]
