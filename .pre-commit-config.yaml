repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: pytest-accounting-critical
        name: pytest accounting critical paths
        entry: python -m pytest tests/accounting/test_balance_constraint.py tests/accounting/test_tax.py -x -q
        language: system
        pass_filenames: false
        always_run: false
        files: ^(dodoo/addons/account/|tests/accounting/)
